name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Format check
        run: pnpm -w format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: terazi
          POSTGRES_USER: terazi
          POSTGRES_PASSWORD: terazi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # prisma/seed.test.ts (packages/core) idempotency doğrulaması için
      # gerçek bir Postgres bağlantısı gerekir — docker-compose.yml'deki
      # lokal kimlik bilgileriyle birebir (docs/08_TESTING_STRATEGY.md §5).
      DATABASE_URL: postgresql://terazi:terazi@localhost:5432/terazi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # pnpm install'ın örtük postinstall'ı bu pnpm workspace düzeninde
        # şemayı bulamayıp sessizce atlıyor (@prisma/client postinstall
        # log'unda "could not find your Prisma schema" uyarısı) — Client
        # üretilmeden `Prisma.Decimal`/`PrismaClient` kullanan hiçbir kod
        # çalışmaz, bu yüzden burada açıkça çalıştırılır.
        run: pnpm --filter core exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --filter core exec prisma migrate deploy

      - name: Seed reference data
        # apps/web/app/api/asset-classes, apps/web/app/api/assets integration testleri
        # (Faz 3 §3.1) idempotent seed'in doldurduğu asset_classes/assets satırlarını
        # okur — docs/09_DEV_WORKFLOW.md §6 adım 5 ile aynı komut.
        run: pnpm --filter core run db:seed

      - name: Test (coverage eşikleriyle)
        run: pnpm -w test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Bu job kendi izole ortamında ayrıca `pnpm install` çalıştırıyor —
        # test job'undaki aynı sebeple (bkz. o job'daki yorum) burada da
        # açıkça çalıştırılmadan `tsc --noEmit`, `@prisma/client`'ın
        # üretilmemiş tiplerinde başarısız olur.
        run: pnpm --filter core exec prisma generate

      - name: Build
        run: pnpm -w build

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: lint
    # docs/08_TESTING_STRATEGY.md §7: Playwright smoke e2e ayrı bir CI job'udur,
    # build'i bloklamaz — bu yüzden `test`/`build`'e değil yalnızca `lint`'e
    # bağımlıdır (paralel çalışır, sonucu görünür ama pipeline'ı durdurmaz).
    # Kendi Postgres servis konteynerini kullanır — `test` job'unun paylaşımlı
    # DB'sindeki worker job testleriyle (tcmb/tefas/coingecko-job.test.ts)
    # fixture çakışması riski taşımaz (bkz. apps/web/e2e/fixtures/price-fixture.ts).
    # `continue-on-error` bilinçli olarak KULLANILMAZ — job'un gerçek başarı/
    # başarısızlık durumu görünür kalmalı ki merge öncesi insan onayı
    # (docs/08 §7, [TEST-005]) gerçek sinyale dayansın; `build`/`test` zaten
    # yalnızca `needs: test`/`needs: lint` zincirinde, `e2e`'ye bağımlı değil —
    # bu job'un başarısız olması onları bloklamaz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: terazi
          POSTGRES_USER: terazi
          POSTGRES_PASSWORD: terazi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://terazi:terazi@localhost:5432/terazi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: pnpm --filter core exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --filter core exec prisma migrate deploy

      - name: Seed reference data
        # asset_classes/assets (Faz 1 §1.3) — journey'lerin varlık seçimi ve
        # tablo render'ı için önkoşul; fiyat fixture'ı ise Playwright
        # `globalSetup`'ında ayrıca eklenir (apps/web/e2e/global-setup.ts).
        run: pnpm --filter core run db:seed

      - name: Run Playwright smoke e2e
        run: pnpm --filter web run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
